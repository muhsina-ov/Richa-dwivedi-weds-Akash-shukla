name = "richa-weds-akash"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat"]

# Static asset hosting on Workers (assets-only Worker)
[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Bindings (none needed for static, but keep file extensible)
# For custom Worker logic you can add [vars] or [[kv_namespaces]] etc.

[observability]
enabled = true
